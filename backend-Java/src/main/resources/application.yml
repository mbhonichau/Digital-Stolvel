server:
  port: ${PORT:8080}

spring:
  application:
    name: digital-stokvel-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:h2:mem:stokveldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: StokvelHikariCP

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.digitalstokvel: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: INFO

momo:
  api:
    base-url: ${MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
    target-environment: ${MOMO_TARGET_ENVIRONMENT:mtnsouthafrica}
    user: ${MOMO_API_USER:test-momo-user}
    key: ${MOMO_API_KEY:test-momo-key}
    subscription-key: ${MOMO_SUBSCRIPTION_KEY:test-subscription-key}

---
# PostgreSQL Production / Container profile
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stokveldb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
