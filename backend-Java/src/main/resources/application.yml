server:
  port: ${PORT:8080}

spring:
  application:
    name: digital-stokvel-backend

  # Load local development credentials from backend-Java/.env. Environment
  # variables still take precedence, so deployment platforms need no change.
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:h2:mem:stokveldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: StokvelHikariCP

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.digitalstokvel: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: INFO

momo:
  base-url: https://proxy.momoapi.mtn.com
  target-environment: mtnsouthafrica
  collection:
    subscription-key: dbb663a2429e4d9ca84dbbcbe2bb59e6
