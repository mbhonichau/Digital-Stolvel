# ==============================================================================
# Dedicated Spring Boot Profile for Supabase PostgreSQL (IPv4 & Pooler Compatible)
# Activated via: --spring.profiles.active=supabase
# ==============================================================================
spring:
  datasource:
    # Uses IPv4-compatible Supabase connection pooler (port 5432 Session mode for Flyway)
    url: ${DB_URL:${SUPABASE_DB_URL:jdbc:postgresql://${SUPABASE_POOLER_HOST:aws-0-eu-central-1.pooler.supabase.com}:5432/postgres?sslmode=require}}
    driver-class-name: org.postgresql.Driver
    # Supabase pooler requires username format: postgres.<project-ref>
    username: ${DB_USERNAME:${SUPABASE_DB_USERNAME:postgres.${SUPABASE_PROJECT_REF:vxleshewjuwjcpnrgeev}}}
    password: ${DB_PASSWORD:${SUPABASE_DB_PASSWORD:}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 600000
      pool-name: SupabaseHikariCP

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

logging:
  level:
    root: INFO
    com.digitalstokvel: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: INFO